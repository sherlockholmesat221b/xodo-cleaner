<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surgical Xodo Watermark Remover</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f5f5f7; color: #1d1d1f; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 480px; padding: 32px; text-align: center; }
        h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
        p { font-size: 14px; color: #86868b; margin-bottom: 24px; }
        .drop-zone { border: 2px dashed #d2d2d7; border-radius: 12px; padding: 36px 20px; cursor: pointer; background: #fafafa; margin-bottom: 20px; }
        .drop-zone:hover, .drop-zone.dragover { border-color: #0071e3; background: #f0f7ff; }
        .file-info { font-size: 13px; color: #0071e3; margin-top: 8px; word-break: break-all; }
        button { width: 100%; background-color: #0071e3; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 500; cursor: pointer; }
        button:disabled { background-color: #d2d2d7; cursor: not-allowed; }
        .status { margin-top: 16px; font-size: 13px; font-weight: 500; }
        .status.success { color: #34c759; }
        .status.error { color: #ff3b30; }
        .status.info { color: #0071e3; }
        .status.warn { color: #ff9500; }
    </style>
</head>
<body>

<div class="card">
    <h1>Surgical Xodo Cleaner</h1>
    <p>Crops the watermark band out and erases every trace of the Xodo/PDFTron watermark tag - never touches your own drawings, stamps, or pasted images.</p>

    <div class="drop-zone" id="dropZone">
        <p id="dropText">Click or drag PDF file here</p>
        <div class="file-info" id="fileInfo"></div>
        <input type="file" id="fileInput" style="display:none" accept="application/pdf">
    </div>

    <button id="processBtn" disabled>Clean and Download</button>
    <div id="status" class="status"></div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const dropText = document.getElementById('dropText');
    const fileInfo = document.getElementById('fileInfo');
    const processBtn = document.getElementById('processBtn');
    const status = document.getElementById('status');

    let selectedFile = null;

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0 && e.dataTransfer.files[0].type === 'application/pdf') {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
        selectedFile = file;
        dropText.textContent = 'Selected File:';
        fileInfo.textContent = file.name;
        processBtn.disabled = false;
        status.textContent = '';
        status.className = 'status';
    }

    function toPlainLower(v) {
        if (!v) return '';
        try {
            if (typeof v.decodeText === 'function') return v.decodeText().toLowerCase();
        } catch (e) { /* not a text string type */ }
        return v.toString().replace(/^\//, '').toLowerCase();
    }

    function isWatermarkOCG(ocgDict, context) {
        try {
            const name = ocgDict.get(PDFLib.PDFName.of('Name'));
            if (name && toPlainLower(name).includes('watermark')) return true;
        } catch (e) {}
        return false;
    }

    function ocTargetsWatermark(ocRaw, context) {
        if (!ocRaw) return false;
        const resolved = context.lookup(ocRaw);
        if (!resolved || typeof resolved.get !== 'function') return false;
        const type = toPlainLower(resolved.get(PDFLib.PDFName.of('Type')));
        if (type === 'ocg') return isWatermarkOCG(resolved, context);
        if (type === 'ocmd') {
            const ocgsRaw = resolved.get(PDFLib.PDFName.of('OCGs'));
            const ocgs = context.lookup(ocgsRaw);
            if (!ocgs) return false;
            if (ocgs instanceof PDFLib.PDFArray) {
                for (let i = 0; i < ocgs.size(); i++) {
                    const g = context.lookup(ocgs.get(i));
                    if (g && isWatermarkOCG(g, context)) return true;
                }
                return false;
            }
            return isWatermarkOCG(ocgs, context);
        }
        return false;
    }

    // Removes a bare /PDFTRON {/Private /Watermark} tag wherever it sits -
    // directly on this dict, or one level down inside /PieceInfo. This key
    // is non-standard vendor metadata that every spec-compliant PDF reader
    // already ignores; removing it can never change how the page renders.
    function stripPdftronWatermarkTag(dict, context) {
        let changed = 0;
        try {
            const pt = context.lookup(dict.get(PDFLib.PDFName.of('PDFTRON')));
            if (pt && typeof pt.get === 'function') {
                const priv = pt.get(PDFLib.PDFName.of('Private'));
                if (priv && toPlainLower(priv).includes('watermark')) {
                    dict.delete(PDFLib.PDFName.of('PDFTRON'));
                    changed++;
                }
            }
        } catch (e) {}
        try {
            const pi = context.lookup(dict.get(PDFLib.PDFName.of('PieceInfo')));
            if (pi && typeof pi.get === 'function') {
                const pt2 = context.lookup(pi.get(PDFLib.PDFName.of('PDFTRON')));
                if (pt2 && typeof pt2.get === 'function') {
                    const priv2 = pt2.get(PDFLib.PDFName.of('Private'));
                    if (priv2 && toPlainLower(priv2).includes('watermark')) {
                        pi.delete(PDFLib.PDFName.of('PDFTRON'));
                        changed++;
                        if (pi.keys().length === 0) dict.delete(PDFLib.PDFName.of('PieceInfo'));
                    }
                }
            }
        } catch (e) {}
        return changed;
    }

    processBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        processBtn.disabled = true;
        status.className = 'status info';
        status.textContent = 'Removing watermark traces...';

        try {
            const fileBuffer = await selectedFile.arrayBuffer();
            const pdfDoc = await PDFLib.PDFDocument.load(fileBuffer);
            const context = pdfDoc.context;
            const stats = { mediabox: 0, headerForms: 0, annots: 0, ocDetached: 0, pdftronStripped: 0 };

            // Cosmetic metadata cleanup
            try {
                pdfDoc.setProducer('Adobe Acrobat Reader');
                pdfDoc.setCreator('');
            } catch (e) { console.warn('Metadata clean notice:', e); }

            const pages = pdfDoc.getPages();

            for (const page of pages) {
                const pageNode = page.node;

                // 1. Restore the true page size Xodo stashed before expanding
                //    the page to fit its header/footer band.
                let markerKey = null;
                for (const key of pageNode.keys()) {
                    if (toPlainLower(key).includes('xodo_watermark_mediabox')) { markerKey = key; break; }
                }
                if (markerKey) {
                    const markerVal = pageNode.get(markerKey);
                    const markerStr = (markerVal && markerVal.decodeText) ? markerVal.decodeText() : markerVal.toString();
                    const coords = markerStr.split(',').map(s => parseFloat(s.trim()));
                    if (coords.length === 4 && coords.every(n => !isNaN(n))) {
                        const trueBox = context.obj(coords);
                        pageNode.set(PDFLib.PDFName.of('MediaBox'), trueBox);
                        if (pageNode.get(PDFLib.PDFName.of('CropBox'))) {
                            pageNode.set(PDFLib.PDFName.of('CropBox'), trueBox);
                        }
                        pageNode.delete(markerKey);
                        stats.mediabox++;
                    }
                }

                // 2. Wipe ONLY the true header/footer overlay form: a direct
                //    child of the page's own Resources/XObject dict whose
                //    /OC points at a "Watermark" OCG. Never recurses into
                //    annotations, so a pasted image can never be caught here.
                const resources = context.lookup(pageNode.get(PDFLib.PDFName.of('Resources')));
                if (resources) {
                    const xobjects = context.lookup(resources.get(PDFLib.PDFName.of('XObject')));
                    if (xobjects && typeof xobjects.keys === 'function') {
                        for (const key of xobjects.keys()) {
                            const xo = context.lookup(xobjects.get(key));
                            if (!xo || !xo.dict) continue;
                            if (ocTargetsWatermark(xo.dict.get(PDFLib.PDFName.of('OC')), context)) {
                                xo.dict.delete(PDFLib.PDFName.of('Filter'));
                                xo.dict.delete(PDFLib.PDFName.of('DecodeParms'));
                                xo.dict.delete(PDFLib.PDFName.of('OC'));
                                xo.contents = new Uint8Array(0);
                                stats.headerForms++;
                            }
                        }
                    }
                }

                // 3. Remove ONLY the annotation Xodo explicitly self-tags as
                //    the watermark link, via its own /TrnCustomData key.
                const annotsRaw = pageNode.get(PDFLib.PDFName.of('Annots'));
                const annots = context.lookup(annotsRaw);
                if (annots instanceof PDFLib.PDFArray) {
                    for (let i = annots.size() - 1; i >= 0; i--) {
                        const a = context.lookup(annots.get(i));
                        if (!a || typeof a.get !== 'function') continue;
                        const tcd = a.get(PDFLib.PDFName.of('TrnCustomData'));
                        if (tcd && toPlainLower(tcd).includes('xodo_watermark')) {
                            annots.remove(i);
                            stats.annots++;
                        }
                    }
                }
            }

            // 4 & 5. Sweep every indirect object in the document: detach any
            // remaining /OC tag that points at a "Watermark" OCG (this only
            // removes the optional-content label - an object with no /OC is
            // simply always visible, exactly as it already was), and strip
            // the bare /PDFTRON{Private:Watermark} metadata tag wherever it
            // appears. Neither of these ever touches actual drawn content.
            for (const [ref, obj] of context.enumerateIndirectObjects()) {
                const dict = obj.dict ? obj.dict : obj; // stream or plain dict
                if (!dict || typeof dict.get !== 'function') continue;

                const oc = dict.get(PDFLib.PDFName.of('OC'));
                if (oc && ocTargetsWatermark(oc, context)) {
                    dict.delete(PDFLib.PDFName.of('OC'));
                    stats.ocDetached++;
                }

                stats.pdftronStripped += stripPdftronWatermarkTag(dict, context);
            }

            // 6. Catalog-level cleanup: drop the layers panel entry and any
            // stray /PieceInfo, and blank out now-orphaned Watermark OCG
            // definitions so no readable trace of the tag remains anywhere.
            try {
                const catalog = pdfDoc.catalog;
                for (const key of catalog.keys()) {
                    const keyStr = toPlainLower(key);
                    if (keyStr === 'ocproperties' || keyStr === 'pieceinfo') catalog.delete(key);
                }
            } catch (e) { console.warn('Catalog clean notice:', e); }

            for (const [ref, obj] of context.enumerateIndirectObjects()) {
                if (obj && typeof obj.get === 'function' && toPlainLower(obj.get(PDFLib.PDFName.of('Type'))) === 'ocg') {
                    if (isWatermarkOCG(obj, context)) {
                        obj.set(PDFLib.PDFName.of('Name'), PDFLib.PDFString.of(''));
                        obj.delete(PDFLib.PDFName.of('PDFTRON'));
                    }
                }
            }

            const pdfBytes = await pdfDoc.save();

            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = selectedFile.name.replace(/\.pdf$/i, '_clean.pdf');
            link.click();

            status.className = 'status success';
            status.textContent = `Cropped ${stats.mediabox} page(s), removed the header form and ${stats.annots} watermark link annotation(s), and stripped ${stats.pdftronStripped} leftover watermark tag(s).`;
        } catch (err) {
            console.error(err);
            status.className = 'status error';
            status.textContent = 'Error: ' + err.message;
        } finally {
            processBtn.disabled = false;
        }
    });
</script>

</body>
</html>
