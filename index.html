<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surgical Xodo Watermark Remover</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f5f5f7; color: #1d1d1f; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 480px; padding: 32px; text-align: center; }
        h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
        p { font-size: 14px; color: #86868b; margin-bottom: 24px; }
        .drop-zone { border: 2px dashed #d2d2d7; border-radius: 12px; padding: 36px 20px; cursor: pointer; background: #fafafa; margin-bottom: 20px; }
        .drop-zone:hover, .drop-zone.dragover { border-color: #0071e3; background: #f0f7ff; }
        .file-info { font-size: 13px; color: #0071e3; margin-top: 8px; word-break: break-all; }
        button { width: 100%; background-color: #0071e3; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 500; cursor: pointer; }
        button:disabled { background-color: #d2d2d7; cursor: not-allowed; }
        .status { margin-top: 16px; font-size: 13px; font-weight: 500; }
        .status.success { color: #34c759; }
        .status.error { color: #ff3b30; }
        .status.info { color: #0071e3; }
        .status.warn { color: #ff9500; }
    </style>
</head>
<body>

<div class="card">
    <h1>Surgical Xodo Cleaner</h1>
    <p>Restores the true page size Xodo stashed away, cropping the watermark out of view.</p>

    <div class="drop-zone" id="dropZone">
        <p id="dropText">Click or drag PDF file here</p>
        <div class="file-info" id="fileInfo"></div>
        <input type="file" id="fileInput" style="display:none" accept="application/pdf">
    </div>

    <button id="processBtn" disabled>Clean and Download</button>
    <div id="status" class="status"></div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const dropText = document.getElementById('dropText');
    const fileInfo = document.getElementById('fileInfo');
    const processBtn = document.getElementById('processBtn');
    const status = document.getElementById('status');

    let selectedFile = null;

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0 && e.dataTransfer.files[0].type === 'application/pdf') {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
        selectedFile = file;
        dropText.textContent = 'Selected File:';
        fileInfo.textContent = file.name;
        processBtn.disabled = false;
        status.textContent = '';
        status.className = 'status';
    }

    function toPlainLower(v) {
        if (!v) return '';
        try {
            if (typeof v.decodeText === 'function') return v.decodeText().toLowerCase();
        } catch (e) { /* not a text string type */ }
        return v.toString().replace(/^\//, '').toLowerCase();
    }

    processBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        processBtn.disabled = true;
        status.className = 'status info';
        status.textContent = 'Restoring true page dimensions...';

        try {
            const fileBuffer = await selectedFile.arrayBuffer();
            const pdfDoc = await PDFLib.PDFDocument.load(fileBuffer);

            // Cosmetic metadata cleanup only - never touches page content,
            // XObjects, or annotations, so it can't destroy anything a
            // person actually drew, pasted, or stamped into the file.
            try {
                pdfDoc.setProducer('Adobe Acrobat Reader');
                pdfDoc.setCreator('');
                const catalog = pdfDoc.catalog;
                for (const key of catalog.keys()) {
                    if (!key) continue;
                    const keyStr = toPlainLower(key);
                    if (keyStr === 'ocproperties' || keyStr === 'pieceinfo') {
                        catalog.delete(key);
                    }
                }
            } catch (e) { console.warn('Catalog clean notice:', e); }

            // PRIMARY (and only structural) fix: Xodo expands each page's
            // MediaBox/CropBox to make room for its header/footer band, and
            // stashes the true original box in a private page-level key
            // before doing so. Restoring that box crops the watermark
            // completely out of the visible/printable page - no need to
            // identify or delete any drawing object, so nothing legitimate
            // (pasted images, stamps, ink) can ever be mistaken for the
            // watermark and destroyed.
            const pages = pdfDoc.getPages();
            let restoredCount = 0;

            for (const page of pages) {
                const pageNode = page.node;
                let markerKey = null;
                for (const key of pageNode.keys()) {
                    if (toPlainLower(key).includes('xodo_watermark_mediabox')) {
                        markerKey = key;
                        break;
                    }
                }
                if (!markerKey) continue;

                const markerVal = pageNode.get(markerKey);
                const markerStr = (markerVal && markerVal.decodeText) ? markerVal.decodeText() : markerVal.toString();
                const coords = markerStr.split(',').map(s => parseFloat(s.trim()));
                if (coords.length === 4 && coords.every(n => !isNaN(n))) {
                    const trueBox = pdfDoc.context.obj(coords);
                    pageNode.set(PDFLib.PDFName.of('MediaBox'), trueBox);
                    if (pageNode.get(PDFLib.PDFName.of('CropBox'))) {
                        pageNode.set(PDFLib.PDFName.of('CropBox'), trueBox);
                    }
                    pageNode.delete(markerKey);
                    restoredCount++;
                }
            }

            const pdfBytes = await pdfDoc.save();

            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = selectedFile.name.replace(/\.pdf$/i, '_clean.pdf');
            link.click();

            if (restoredCount > 0) {
                status.className = 'status success';
                status.textContent = `Restored true page size on ${restoredCount} page(s) - watermark cropped out.`;
            } else {
                status.className = 'status warn';
                status.textContent = 'No Xodo page-size marker found. File saved unchanged (metadata still cleared).';
            }
        } catch (err) {
            console.error(err);
            status.className = 'status error';
            status.textContent = 'Error: ' + err.message;
        } finally {
            processBtn.disabled = false;
        }
    });
</script>

</body>
</html>
